<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome - 18 Dough District</title>
  <!-- 🧁 Logo sa tab -->
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Alternative para mas compatible -->
  <!-- <link rel="shortcut icon" href="favicon.ico" type="image/x-icon"> -->
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url('cover-photo.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    @keyframes fadeOut { from {opacity:1;} to {opacity:0;} }

    .welcome-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 0 15px rgba(255,255,255,0.9);
    }
    a {
      display: inline-block;
      background: black;
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      font-size: 1.1em;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }
    a:hover {
      background: #333;
      box-shadow: 0 0 15px rgba(255,255,255,1);
    }

    /* 📱 Mobile Responsive */
    @media (max-width: 768px) {
      .welcome-box {
        padding: 30px;
      }
      h1 {
        font-size: 1.8em;
      }
      a {
        font-size: 1em;
        width: 100%; /* full width button sa mobile */
      }
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h1>Welcome to 18 Dough District</h1>
    <a href="home.html">Get Started</a>
  </div>

  <script>
    // Smooth fade-out on navigation
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", function(e) {
        if (this.href.includes(".html")) {
          e.preventDefault();
          document.body.style.animation = "fadeOut 0.8s ease forwards";
          setTimeout(() => { window.location.href = this.href; }, 800);
        }
      });
    });
  </script>
</body>
</html>
