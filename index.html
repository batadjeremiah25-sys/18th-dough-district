<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome - 18 Dough District</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url('cover-photo.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .welcome-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: white;
    }
    a {
      display: inline-block;
      background: black;
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      font-size: 1.1em;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }
    a:hover {
      background: #333;
      box-shadow: 0 0 15px rgba(255,255,255,1);
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h1>Welcome to 18 Dough District</h1>
    <!-- Now points to home.html -->
    <a href="home.html">Get Started</a>
  </div>
</body>
</html>
